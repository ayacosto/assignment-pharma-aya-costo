<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #fff; color: #111;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.5;
    display: flex; flex-direction: column;
  }
  .tabs { display: flex; gap: 4px; padding: 10px 16px 0; border-bottom: 1px solid #e5e5e5; }
  .tab {
    border: none; background: none; padding: 8px 14px; cursor: pointer;
    font: inherit; color: #777; border-bottom: 2px solid transparent;
  }
  .tab.active { color: #111; border-bottom-color: #111; }
  .panel { flex: 1; overflow-y: auto; padding: 16px; display: none; }
  .panel.active { display: block; }
  .inner { max-width: 760px; margin: 0 auto; }

  .msg { margin: 0 0 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { background: #f2f2f2; padding: 10px 14px; border-radius: 14px; margin-left: 20%; }
  .msg.bot { padding: 2px 0; white-space: normal; }
  .msg.bot p { margin: 0 0 8px; }
  .msg.bot ul, .msg.bot ol { margin: 0 0 8px; padding-left: 22px; }
  .msg.bot li { margin-bottom: 4px; }
  .msg.error { color: #b00020; }

  .composer { border-top: 1px solid #e5e5e5; padding: 12px 16px; }
  .composer form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  .composer input {
    flex: 1; padding: 11px 14px; font: inherit; color: inherit;
    border: 1px solid #d4d4d4; border-radius: 12px; outline: none; background: #fff;
  }
  .composer input:focus { border-color: #888; }
  .composer button {
    padding: 0 18px; border: none; border-radius: 12px; background: #111; color: #fff;
    font: inherit; cursor: pointer;
  }
  .composer button:disabled { opacity: .4; cursor: default; }

  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #777; margin: 22px 0 8px; }
  h3:first-child { margin-top: 0; }
  ul { margin: 0; padding-left: 20px; }
  .chunk { border: 1px solid #e5e5e5; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .chunk summary { cursor: pointer; }
  .chunk .meta { color: #777; font-size: 13px; }
  .chunk pre { white-space: pre-wrap; word-wrap: break-word; font: inherit; margin: 10px 0 0; }
  .empty { color: #999; }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab active" data-panel="chat">Chat</button>
  <button class="tab" data-panel="steps">Étapes</button>
</div>

<div class="panel active" id="chat"><div class="inner" id="messages"></div></div>
<div class="panel" id="steps"><div class="inner" id="steps-content"><p class="empty">Aucune question posée.</p></div></div>

<div class="composer">
  <form id="form">
    <input id="question" type="text" placeholder="Poser une question" autocomplete="off" autofocus>
    <button id="send" type="submit">Envoyer</button>
  </form>
</div>

<script>
  const messages = document.getElementById("messages");
  const stepsContent = document.getElementById("steps-content");
  const input = document.getElementById("question");
  const sendButton = document.getElementById("send");

  // --- Onglets ---
  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
      document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById(tab.dataset.panel).classList.add("active");
    });
  });

  // --- Helpers DOM (textContent partout : jamais d'HTML venant du serveur) ---
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function addMessage(text, className) {
    const node = el("div", "msg " + className, text);
    messages.appendChild(node);
    node.scrollIntoView({ block: "end" });
    return node;
  }

  function addList(title, items) {
    stepsContent.appendChild(el("h3", null, title));
    if (!items || items.length === 0) {
      stepsContent.appendChild(el("p", "empty", "Aucun"));
      return;
    }
    const list = el("ul");
    items.forEach((item) => list.appendChild(el("li", null, item)));
    stepsContent.appendChild(list);
  }

  // --- Rendu Markdown minimal : **gras**, listes "-" et "1.", paragraphes ---
  // Tout est construit avec createElement/textContent : aucun HTML du serveur n'est interprete.
  // Les breadcrumbs "a > b > c" s'affichent avec des fleches "a => b => c"
  // (uniquement sur les lignes de citation, pour ne pas toucher aux "dose > 5 mg").
  function arrows(line) {
    return line.includes("Source") ? line.split(" > ").join(" => ") : line;
  }

  function appendInline(parent, text) {
    text.split(/(\*\*[^*]+\*\*)/).forEach((part) => {
      if (part.startsWith("**") && part.endsWith("**") && part.length > 4) {
        parent.appendChild(el("strong", null, part.slice(2, -2)));
      } else if (part) {
        parent.appendChild(document.createTextNode(part));
      }
    });
  }

  function renderMarkdown(container, markdown) {
    container.replaceChildren();
    let list = null;
    let paragraph = null;
    markdown.split("\n").map(arrows).forEach((line) => {
      const bullet = line.match(/^\s*[-*\u2022]\s+(.*)$/);
      const numbered = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (bullet || numbered) {
        paragraph = null;
        const type = bullet ? "ul" : "ol";
        if (!list || list.tagName.toLowerCase() !== type) {
          list = el(type);
          container.appendChild(list);
        }
        const item = el("li");
        appendInline(item, (bullet || numbered)[1]);
        list.appendChild(item);
      } else if (line.trim() === "") {
        list = null;
        paragraph = null;
      } else {
        list = null;
        if (!paragraph) {
          paragraph = el("p");
          container.appendChild(paragraph);
        } else {
          paragraph.appendChild(document.createElement("br"));
        }
        appendInline(paragraph, line.trim());
      }
    });
  }

  // --- Onglet "Étapes" ---
  function renderSteps(details) {
    stepsContent.replaceChildren();
    addList("Questions de recherche", details.search_queries);
    addList("Étapes de raisonnement", details.reasoning_steps);

    const chunks = details.chunks || [];
    stepsContent.appendChild(el("h3", null, "Chunks gardés (" + chunks.length + ")"));
    if (chunks.length === 0) stepsContent.appendChild(el("p", "empty", "Aucun"));
    chunks.forEach((chunk) => {
      const box = el("details", "chunk");
      const summary = el("summary");
      summary.appendChild(document.createTextNode(
        chunk.source + " => " + (chunk.breadcrumb || "").split(" > ").join(" => ")
      ));
      const score = chunk.rerank_score != null ? chunk.rerank_score.toFixed(3) : "-";
      summary.appendChild(el("div", "meta", "score de rerank : " + score));
      box.appendChild(summary);
      box.appendChild(el("pre", null, chunk.texte));
      stepsContent.appendChild(box);
    });

    stepsContent.appendChild(el("h3", null, "Validation"));
    stepsContent.appendChild(el("p", null, "Révisions : " + (details.revisions || 0)));
    if (details.critique) stepsContent.appendChild(el("pre", null, details.critique));
  }

  // --- Envoi d'une question ---
  document.getElementById("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, "user");
    input.value = "";
    sendButton.disabled = true;
    input.disabled = true;
    const pending = addMessage("...", "bot");

    try {
      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      if (!response.ok) throw new Error("Erreur " + response.status);
      const data = await response.json();
      renderMarkdown(pending, data.answer);
      renderSteps(data.details || {});
    } catch (error) {
      pending.textContent = "Une erreur est survenue : " + error.message;
      pending.classList.add("error");
    } finally {
      sendButton.disabled = false;
      input.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
